[project]
name = "mexcmm"
version = "0.1.0"
description = "Record MEXC spot order books and trades to study market making"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["websockets>=15", "pyarrow>=17", "numpy>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
